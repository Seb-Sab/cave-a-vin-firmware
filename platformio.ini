; ============================================================
; Cave a vin - projet PlatformIO pour ESP32 D1 Mini
; ============================================================

[env:wemos_d1_mini32]
platform  = espressif32
board     = wemos_d1_mini32
framework = arduino

monitor_speed = 115200
upload_speed  = 460800

; Garde le firmware en mode natif C++ (pas d'extensions particulieres)
build_flags =
    -D CORE_DEBUG_LEVEL=0

; Bibliotheques utilisees. PlatformIO les telechargera automatiquement
; au premier build.
lib_deps =
    adafruit/Adafruit PN532 @ ^1.3.4
    adafruit/Adafruit SH110X @ ^2.1.10
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit NeoPixel @ ^1.12.0
    bblanchon/ArduinoJson @ ^6.21.5

; --- Options utiles ---
; Pour televerser par OTA une fois le WiFi configure :
; upload_protocol = espota
; upload_port = 192.168.1.XX
