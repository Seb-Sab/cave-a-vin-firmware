name: Build & Release Firmware

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Generate config.h from secrets
        env:
          WIFI_SSID:        ${{ secrets.WIFI_SSID }}
          WIFI_PASS:        ${{ secrets.WIFI_PASS }}
          SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cat > include/config.h << EOF
          #pragma once

          // =====================================================================
          //  Cave a vin - configuration (generee par GitHub Actions)
          // =====================================================================

          // ---- WiFi ----
          #define WIFI_SSID   "${WIFI_SSID}"
          #define WIFI_PASS   "${WIFI_PASS}"

          // ---- Supabase API ----
          #define SUPABASE_URL       "${SUPABASE_URL}"
          #define SUPABASE_ANON_KEY  "${SUPABASE_ANON_KEY}"
          #define DEVICE_TOKEN_DEFAULT  ""

          // ---- Periodes et timings ----
          #define ENV_PERIOD_MS          (10UL * 60UL * 1000UL)
          #define EDIT_WINDOW_MS         (10000UL)
          #define LONGPRESS_MS           (3000UL)
          #define DEBOUNCE_MS            (30UL)
          #define ENROLL_TIMEOUT_MS      (30000UL)
          #define DARK_TIMEOUT_MS        (30000UL)
          #define INACTIVITY_TIMEOUT_MS  (30UL * 60UL * 1000UL)
          #define ALARM_ACK_TIMEOUT_MS   (5UL * 60UL * 1000UL)
          #define STARTUP_ENV_DELAY_MS   (60000UL)

          // ---- Broches ----
          #define PIN_LED         2
          #define PIN_MOSFET      25
          #define PIN_LDR         34
          #define PIN_LED_STRIP   26
          #define PIN_BTN_PLUS    32
          #define PIN_BTN_MINUS   33
          #define PIN_I2C_SDA     21
          #define PIN_I2C_SCL     22

          // ---- OLED (SH1106 1.3") ----
          #define OLED_WIDTH   128
          #define OLED_HEIGHT  64
          #define OLED_ADDR    0x3C

          // ---- PN532 (I2C) ----
          #define PN532_I2C_ADDR  0x24

          // ---- Ruban LED ----
          #define LED_COUNT       15
          #define LED_BTN_MINUS   11
          #define LED_BTN_PLUS    13

          // ---- LDR seuil veille ----
          #define LDR_DARK_THRESHOLD  1000

          // ---- Touch buttons ----
          #define TOUCH_THRESHOLD     50

          // ---- Mesure quotidienne en deep sleep ----
          #define ENV_DAILY_WAKEUP_US  (24ULL * 60ULL * 60ULL * 1000000ULL)
          #define BME_WARMUP_MS        (5UL  * 60UL  * 1000UL)

          // ---- Portail de configuration ----
          #define PORTAL_AP_SSID  "Cave-a-vin"

          // ---- OTA via GitHub Releases ----
          #define FIRMWARE_VERSION   "${{ github.ref_name }}"
          #define GITHUB_REPO_OWNER  "Seb-Sab"
          #define GITHUB_REPO_NAME   "cave-a-vin-firmware"

          // ---- Seuils alarme cave ----
          #define TEMP_MIN_DEFAULT  10.0f
          #define TEMP_MAX_DEFAULT  14.0f
          #define HUM_MIN_DEFAULT   60.0f
          #define HUM_MAX_DEFAULT   80.0f
          EOF

      - name: Build firmware
        run: pio run --environment wemos_d1_mini32

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: .pio/build/wemos_d1_mini32/firmware.bin
          generate_release_notes: false
          body: |
            Firmware Cave à vin ${{ github.ref_name }}

            **Installation OTA** : le device se met à jour automatiquement au prochain démarrage s'il détecte cette version.
            **Flash manuel** : télécharger `firmware.bin` et flasher via PlatformIO ou esptool.
